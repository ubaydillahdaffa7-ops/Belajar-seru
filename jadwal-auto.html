<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Auto — DAFZZ</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
        background: linear-gradient(135deg, #7c3aed 0%, #ec4899 50%, #fbbf24 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .card {
        background: white;
        border-radius: 24px;
        padding: 28px 24px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        text-align: center;
    }
    .clock {
        font-size: 2.4rem;
        font-weight: 900;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-variant-numeric: tabular-nums;
        margin-bottom: 4px;
    }
    .date {
        font-size: 0.8rem;
        color: #6b7280;
        font-weight: 700;
        margin-bottom: 20px;
    }
    .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #6b7280;
        font-weight: 800;
        margin-bottom: 6px;
    }
    .mapel {
        font-size: 1.8rem;
        font-weight: 900;
        color: #1f2937;
        margin-bottom: 4px;
    }
    .jam {
        font-size: 0.9rem;
        color: #7c3aed;
        font-weight: 700;
        margin-bottom: 20px;
    }
    .ruang {
        display: inline-block;
        background: linear-gradient(135deg, #ede9fe, #fce7f3);
        color: #7c3aed;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: 800;
        font-size: 0.85rem;
    }
    .schedule-list {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 2px dashed #e5e7eb;
        text-align: left;
    }
    .schedule-list h3 {
        font-size: 0.85rem;
        color: #6b7280;
        margin-bottom: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .day-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 10px;
        margin-bottom: 4px;
        font-size: 0.8rem;
    }
    .day-row.today {
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: white;
        font-weight: 800;
    }
    .day-row.today .mapel-name { color: white; }
    .day-name { font-weight: 700; color: #1f2937; }
    .day-row.today .day-name { color: white; }
    .mapel-name { color: #6b7280; }
    .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #7c3aed;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.85rem;
    }
    .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">Memuat...</div>

    <div class="label">Pelajaran Hari Ini</div>
    <div class="mapel" id="mapel">Memuat...</div>
    <div class="jam" id="jam">--</div>
    <div class="ruang" id="ruang">-</div>

    <div class="schedule-list">
        <h3>Jadwal Mingguan</h3>
        <div id="schedule-list"></div>
    </div>

    <a href="index.html" class="back-link">← Kembali ke App Utama</a>
</div>

<script>
// ===== JADWAL MINGGUAN =====
// Kamu bisa ubah jadwal di sini
const JADWAL = {
    1: { mapel: 'Matematika',      jam: '07.00 - 08.30', ruang: 'Ruang B1' },     // Senin
    2: { mapel: 'TIK',             jam: '07.00 - 08.30', ruang: 'Lab Komputer' }, // Selasa
    3: { mapel: 'Matematika',      jam: '07.00 - 08.30', ruang: 'Ruang B1' },     // Rabu
    4: { mapel: 'IPS',             jam: '07.00 - 08.30', ruang: 'Ruang B2' },     // Kamis
    5: { mapel: 'Agama',           jam: '07.00 - 08.30', ruang: 'Ruang A1' },     // Jumat
    6: { mapel: 'Ekstrakurikuler', jam: '07.00 - 09.00', ruang: 'Lapangan' }      // Sabtu
};

const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_HARI_PANJANG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function updateAll() {
    const now = new Date();
    const hari = now.getDay();
    const tanggal = now.getDate();
    const bulan = now.getMonth();
    const tahun = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');

    // Jam
    document.getElementById('clock').innerText = hh + ':' + mm + ':' + ss;

    // Tanggal lengkap
    document.getElementById('date').innerText =
        NAMA_HARI_PANJANG[hari] + ', ' + tanggal + ' ' + NAMA_BULAN[bulan] + ' ' + tahun;

    // Pelajaran hari ini
    const jadwal = JADWAL[hari];
    const mapelEl = document.getElementById('mapel');
    const jamEl = document.getElementById('jam');
    const ruangEl = document.getElementById('ruang');

    if (jadwal) {
        mapelEl.innerText = jadwal.mapel;
        jamEl.innerText = jadwal.jam;
        ruangEl.innerText = jadwal.ruang;
    } else {
        mapelEl.innerText = 'Hari Libur';
        jamEl.innerText = 'Tidak ada kelas';
        ruangEl.innerText = '-';
    }

    // Highlight hari ini di list
    renderSchedule(hari);
}

function renderSchedule(todayIdx) {
    const list = document.getElementById('schedule-list');
    let html = '';
    for (let i = 1; i <= 6; i++) {
        const j = JADWAL[i];
        const isToday = i === todayIdx;
        const cls = isToday ? 'day-row today' : 'day-row';
        html += `
            <div class="${cls}">
                <span class="day-name">${NAMA_HARI[i]}</span>
                <span class="mapel-name">${j ? j.mapel : '-'}</span>
            </div>
        `;
    }
    if (todayIdx === 0) {
        html += `
            <div class="day-row today" style="justify-content:center;">
                <span class="day-name">Minggu — Hari Libur</span>
            </div>
        `;
    }
    list.innerHTML = html;
}

// Update tiap detik
setInterval(updateAll, 1000);
updateAll();
</script>

</body>
</html>
