<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>DAFZZ AI v3.0</title>
<style>
:root {
  --p: #7c3aed;
  --pl: #a78bfa;
  --ps: #ede9fe;
  --pk: #ec4899;
  --ye: #fbbf24;
  --gr: #10b981;
  --bl: #3b82f6;
  --rd: #ef4444;
  --bg: #f8f9fe;
  --bg2: linear-gradient(135deg,#faf5ff,#fdf2f8,#eff6ff);
  --card: #fff;
  --tx: #1f2937;
  --ts: #6b7280;
  --bb: #fff;
  --ub: linear-gradient(135deg,#7c3aed,#ec4899);
  --bd: #e5e7eb;
}
body.dark {
  --bg: #0f172a;
  --bg2: linear-gradient(135deg,#0f172a,#1a1f3a,#0f172a);
  --card: #1e293b;
  --tx: #f1f5f9;
  --ts: #94a3b8;
  --bb: #1e293b;
  --bd: #334155;
  --ps: #312e81;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  overflow: hidden;
}
body {
  background: var(--bg);
  background-image: var(--bg2);
  background-attachment: fixed;
  color: var(--tx);
  display: flex;
  justify-content: center;
  transition: background .3s,color .3s;
}
#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .35;
}
.app {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  background-image: var(--bg2);
  background-attachment: fixed;
  position: relative;
  z-index: 1;
}
@media(min-width:600px) {
  body { align-items: center; padding: 20px; }
  .app { height: 92vh; max-height: 880px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
}
header {
  padding: 14px 16px;
  background: linear-gradient(135deg,#7c3aed,#ec4899);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(124,58,237,.35);
  z-index: 10;
  position: relative;
  flex-shrink: 0;
}
.back {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  transition: .2s;
  flex-shrink: 0;
}
.back:hover { background: rgba(255,255,255,.25); }
.ava {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: rgba(255,255,255,.2);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,.4);
  animation: avB 2s ease-in-out infinite;
  flex-shrink: 0;
  font-weight: 900;
  font-size: .95rem;
}
@keyframes avB {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-3px) rotate(3deg); }
}
.bi { flex: 1; min-width: 0; }
.bi h2 {
  font-size: 1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.bi h2 .bdg {
  font-size: .55rem;
  background: rgba(255,255,255,.25);
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 700;
}
.bi p {
  font-size: .7rem;
  opacity: .95;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 6px #10b981;
  animation: pd 1.5s infinite;
  display: inline-block;
  flex-shrink: 0;
}
@keyframes pd {
  0%,100% { opacity: 1; }
  50% { opacity: .4; }
}
.hac { display: flex; gap: 6px; flex-shrink: 0; }
.ib {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  cursor: pointer;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s;
}
.ib:hover { background: rgba(255,255,255,.3); }
.ib:active { transform: scale(.9); }
.chat {
  flex: 1;
  padding: 18px 14px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  position: relative;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-thumb { background: rgba(124,58,237,.3); border-radius: 2px; }
.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: .9rem;
  line-height: 1.55;
  word-wrap: break-word;
  overflow-wrap: break-word;
  animation: sIn .35s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
@keyframes sIn {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.msg.bot {
  background: var(--bb);
  align-self: flex-start;
  border-bottom-left-radius: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  border: 1px solid rgba(124,58,237,.1);
  color: var(--tx);
}
body.dark .msg.bot { border-color: rgba(124,58,237,.3); }
.msg.user {
  background: var(--ub);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 6px;
  box-shadow: 0 4px 15px rgba(124,58,237,.3);
}
.msg a {
  color: #7c3aed;
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1px dashed rgba(124,58,237,.4);
}
.msg.user a { color: #fff; text-decoration: underline; }
body.dark .msg.bot a { color: #a78bfa; }
.msg b, .msg strong { font-weight: 800; }
.msg code {
  background: rgba(124,58,237,.1);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New',monospace;
  font-size: .85em;
  color: var(--p);
}
.msg .ts {
  font-size: .6rem;
  opacity: .5;
  margin-top: 6px;
  display: block;
}
.typ {
  display: flex;
  gap: 4px;
  padding: 14px 18px!important;
  align-items: center;
}
.typ span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pl);
  animation: tB 1.4s infinite;
}
.typ span:nth-child(2) { animation-delay: .2s; }
.typ span:nth-child(3) { animation-delay: .4s; }
@keyframes tB {
  0%,60%,100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-8px); opacity: 1; }
}
.sug {
  padding: 8px 14px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--bd);
  flex-shrink: 0;
}
body.dark .sug { background: rgba(30,41,59,.6); }
.sug::-webkit-scrollbar { height: 0; }
.chip {
  padding: 8px 14px;
  background: var(--card);
  border: 1.5px solid rgba(124,58,237,.2);
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--p);
  cursor: pointer;
  white-space: nowrap;
  transition: .2s;
  flex-shrink: 0;
  font-family: inherit;
}
.chip:hover {
  background: linear-gradient(135deg,#7c3aed,#ec4899);
  color: #fff;
  border-color: transparent;
  transform: translateY(-2px);
}
.ia {
  padding: 12px 14px 14px;
  background: var(--card);
  border-top: 1px solid var(--bd);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
input[type=text] {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid var(--bd);
  border-radius: 24px;
  font-size: .9rem;
  outline: none;
  background: var(--bg);
  color: var(--tx);
  font-family: inherit;
}
input[type=text]:focus {
  border-color: var(--pl);
  box-shadow: 0 0 0 3px rgba(167,139,250,.15);
}
input[type=text]::placeholder { color: var(--ts); }
.sb {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg,#7c3aed,#ec4899);
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(124,58,237,.4);
  transition: .15s;
  flex-shrink: 0;
}
.sb:hover { transform: scale(1.05); }
.sb:active { transform: scale(.9); }
.mb {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--bd);
  color: var(--p);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s;
  flex-shrink: 0;
}
.mb:hover { border-color: var(--p); background: var(--ps); }
.mb.rec {
  background: #ef4444;
  color: #fff;
  border-color: #ef4444;
  animation: mp 1s infinite;
}
@keyframes mp {
  0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); }
  50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
}
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg,#1f2937,#7c3aed);
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: .8rem;
  font-weight: 700;
  z-index: 3000;
  opacity: 0;
  transition: .3s;
  pointer-events: none;
  box-shadow: 0 8px 20px rgba(0,0,0,.3);
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.scb {
  position: absolute;
  bottom: 100px;
  right: 20px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg,#7c3aed,#ec4899);
  border: none;
  color: #fff;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(124,58,237,.4);
  z-index: 100;
  animation: sIn .3s ease;
}
.scb.show { display: flex; }
.conf {
  position: fixed;
  width: 10px;
  height: 10px;
  background: #fbbf24;
  top: -10px;
  z-index: 5000;
  pointer-events: none;
  animation: cF 2.5s linear forwards;
  border-radius: 2px;
}
@keyframes cF {
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
.fb { display: flex; gap: 6px; margin-top: 8px; }
.fb button {
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--bd);
  border-radius: 12px;
  font-size: .7rem;
  cursor: pointer;
  color: var(--ts);
  transition: .2s;
  font-family: inherit;
}
.fb button:hover {
  background: var(--ps);
  border-color: var(--p);
  color: var(--p);
}
.fb button.active {
  background: var(--p);
  color: #fff;
  border-color: var(--p);
}
@media(max-width:380px) {
  .bi h2 { font-size: .9rem; }
  .bi p { font-size: .62rem; }
  .ava { width: 38px; height: 38px; font-size: .85rem; }
  .ib { width: 30px; height: 30px; }
  .msg { font-size: .85rem; padding: 10px 14px; }
  .mb, .sb { width: 42px; height: 42px; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
<header>
  <button class="back" onclick="location.href='index.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
  </button>
  <div class="ava">DA</div>
  <div class="bi">
    <h2>DAFZZ AI <span class="bdg">v3.0</span></h2>
    <p><span class="dot"></span> Online | 90+ topik</p>
  </div>
  <div class="hac">
    <button class="ib" onclick="toggleDark()" title="Dark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="ib" onclick="exportChat()" title="Export">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="ib" onclick="clearChat()" title="Clear">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
    </button>
  </div>
</header>
<div class="chat" id="chat">
  <div class="msg bot">
    Halo! Aku <b>DAFZZ AI v3.0</b>.<br><br>
    Aku siap bantu belajar <b>13 mapel</b> dan jelasin tentang developer hebat 𓆩 ᖽᐸɪղᘜ ༒ ᙃᴀ̷𝖿ᴢᴢ 𓆪.<br><br>
    Mau tanya apa?
  </div>
</div>
<button class="scb" id="scb" onclick="scrollToBottom()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <polyline points="19 12 12 19 5 12"/>
  </svg>
</button>
<div class="sug" id="sug"></div>
<div class="ia">
  <button class="mb" id="mbtn" onclick="toggleVoice()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
    </svg>
  </button>
  <input type="text" id="ci" placeholder="Tanya materi atau profil developer..." onkeypress="if(event.key==='Enter')kirim()" autocomplete="off">
  <button class="sb" onclick="kirim()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
// ========== PARTICLES ==========
(function(){
  var c = document.getElementById('fx');
  var x = c.getContext('2d');
  var ps = [];
  var cs = ['#a78bfa','#ec4899','#fbbf24','#10b981','#3b82f6'];
  function rs() {
    c.width = innerWidth;
    c.height = innerHeight;
  }
  rs();
  addEventListener('resize', rs);
  for (var i = 0; i < 30; i++) {
    ps.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 2.5 + 1,
      vx: (Math.random() - .5) * .4,
      vy: (Math.random() - .5) * .4,
      cl: cs[Math.floor(Math.random() * cs.length)]
    });
  }
  function an() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(function(p) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > c.width) p.vx *= -1;
      if (p.y < 0 || p.y > c.height) p.vy *= -1;
      x.beginPath();
      x.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      x.fillStyle = p.cl;
      x.globalAlpha = .55;
      x.fill();
    });
    x.globalAlpha = 1;
    requestAnimationFrame(an);
  }
  an();
})();

// ========== SOUND/TOAST ==========
var actx = null;
function beep(f) {
  f = f || 600;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.connect(g);
    g.connect(actx.destination);
    o.frequency.setValueAtTime(f, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f * .7, actx.currentTime + .08);
    g.gain.setValueAtTime(.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .08);
    o.start();
    o.stop(actx.currentTime + .08);
  } catch(e) {}
}
var tt;
function toast(m) {
  var t = document.getElementById('toast');
  t.innerText = m;
  t.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(function() { t.classList.remove('show'); }, 2200);
}
function getTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toggleDark() {
  beep();
  document.body.classList.toggle('dark');
  var d = document.body.classList.contains('dark');
  localStorage.setItem('dafzz_dark', d ? '1' : '0');
  toast(d ? 'Mode Gelap' : 'Mode Terang');
}
if (localStorage.getItem('dafzz_dark') === '1') document.body.classList.add('dark');
function confetti() {
  var cs = ['#fbbf24','#ec4899','#7c3aed','#10b981','#3b82f6'];
  for (var i = 0; i < 20; i++) {
    (function() {
      var c = document.createElement('div');
      c.className = 'conf';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = cs[Math.floor(Math.random() * cs.length)];
      c.style.animationDelay = Math.random() * .3 + 's';
      document.body.appendChild(c);
      setTimeout(function() { c.remove(); }, 3000);
    })();
  }
}
var chatEl = document.getElementById('chat');
var scbEl = document.getElementById('scb');
chatEl.addEventListener('scroll', function() {
  scbEl.classList.toggle('show', chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight >= 100);
});
function scrollToBottom() {
  beep();
  chatEl.scrollTop = chatEl.scrollHeight;
}
var SUG = [
  'Siapa developer aplikasi ini?',
  'Berapa umur developer?',
  'Rumus Pythagoras',
  'Apa itu fotosintesis?',
  'Hukum Newton',
  'Tips belajar fokus',
  'Proklamasi kemerdekaan',
  'Rumus ABC',
  'Apa itu DNA?',
  'Konversi 5 km ke m'
];
function renderSug() {
  var w = document.getElementById('sug');
  w.innerHTML = SUG.map(function(s) {
    var e = s.replace(/'/g, "\\'");
    return '<button class="chip" onclick="kirimChip(\'' + e + '\')">' + s + '</button>';
  }).join('');
}
function kirimChip(t) {
  document.getElementById('ci').value = t;
  kirim();
}
renderSug();
function exportChat() {
  beep();
  var msgs = chatEl.querySelectorAll('.msg');
  var txt = '=== DAFZZ AI CHAT ===\n' + new Date().toLocaleString('id-ID') + '\n\n';
  msgs.forEach(function(m) {
    var r = m.classList.contains('user') ? 'USER' : 'BOT';
    txt += '[' + r + ']\n' + m.innerText + '\n\n';
  });
  var b = new Blob([txt], {type:'text/plain'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u;
  a.download = 'dafzz-' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(u);
  toast('Diexport ke .txt');
}
function clearChat() {
  if (!confirm('Hapus chat?')) return;
  beep();
  chatEl.innerHTML = '<div class="msg bot">Chat dibersihkan. Mau tanya apa?<span class="ts">' + getTime() + '</span></div>';
  toast('Chat dihapus');
}
var rec = null;
var isRec = false;
function initVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('mbtn').style.display = 'none';
    return;
  }
  rec = new SR();
  rec.lang = 'id-ID';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onresult = function(e) {
    var t = e.results[0][0].transcript;
    document.getElementById('ci').value = t;
    isRec = false;
    document.getElementById('mbtn').classList.remove('rec');
    toast('Terdeteksi: ' + t.substring(0, 30));
  };
  rec.onerror = function() {
    isRec = false;
    document.getElementById('mbtn').classList.remove('rec');
    toast('Gagal deteksi');
  };
  rec.onend = function() {
    isRec = false;
    document.getElementById('mbtn').classList.remove('rec');
  };
}

    document.getElementById('mbtn').classList.remove('rec');
  } else {

      isRec = true;
      document.getElementById('mbtn').classList.add('rec');
      toast('Bicara...');
    } catch(e) {
      toast('Gagal');
    }
  }
}

function mulaiKuis(m) {
  var d = KUIS[m.toLowerCase()];
  if (!d) return 'Kuis belum tersedia. Coba: matematika, ipa, ips, b indonesia.';
  var q = d[Math.floor(Math.random() * d.length)];
  return '<b>KUIS ' + m.toUpperCase() + '</b><br><br>' + q.s + '<br><br><i>(Jawab di chat untuk diperiksa)</i>';
}
var lastKuis = null;
// ========== RUMUS ==========
function cekRumus(t) {
  var q = t.toLowerCase();
  var r = {
    'luas persegi': 'L = s×s',
    'keliling persegi': 'K = 4×s',
    'luas persegi panjang': 'L = p×l',
    'keliling persegi panjang': 'K = 2×(p+l)',
    'luas segitiga': 'L = ½×a×t',
    'luas lingkaran': 'L = π×r²',
    'keliling lingkaran': 'K = 2×π×r',
    'volume kubus': 'V = s³',
    'volume balok': 'V = p×l×t',
    'volume tabung': 'V = π×r²×t',
    'volume bola': 'V = 4/3×π×r³',
    'volume kerucut': 'V = 1/3×π×r²×t',
    'rumus abc': 'x = (-b±√(b²-4ac))/2a',
    'pythagoras': 'c² = a²+b²',
    'hukum ohm': 'V = I×R',
    'energi kinetik': 'Ek = ½×m×v²',
    'energi potensial': 'Ep = m×g×h',
    'kalor': 'Q = m×c×ΔT',
    'molaritas': 'M = mol/V(L)',
    'kecepatan': 'v = s/t',
    'percepatan': 'a = Δv/Δt',
    'gaya': 'F = m×a',
    'usaha': 'W = F×s',
    'daya': 'P = W/t',
    'tekanan': 'P = F/A',
    'massa jenis': 'ρ = m/V'
  };
  for (var k in r) {
    if (q.includes(k) || q.includes('rumus ' + k)) {
      return '<b>RUMUS ' + k.toUpperCase() + '</b><br><br><b>' + r[k] + '</b>';
    }
  }
  return null;
}
// ========== KONVERSI ==========
function konversi(t) {
  var q = t.toLowerCase();
  var m = q.match(/(\d+(?:\.\d+)?)\s*(km|m|cm|mm|kg|g|mg|ton|liter|l|ml)\s*(?:ke|to)\s*(km|m|cm|mm|kg|g|mg|ton|liter|l|ml)/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  var d = m[2];
  var k = m[3];
  var p = {km:1000, m:1, cm:0.01, mm:0.001};
  var b = {kg:1000, g:1, mg:0.001, ton:1000000};
  var v = {liter:1, l:1, ml:0.001};
  var h = null;
  if (p[d] && p[k]) h = n * p[d] / p[k];
  else if (b[d] && b[k]) h = n * b[d] / b[k];
  else if (v[d] && v[k]) h = n * v[d] / v[k];
  if (h !== null) return '<b>' + n + ' ' + d + '</b> = <b>' + h + ' ' + k + '</b>';
  return null;
}
// ========== KALKULATOR ==========
function hitung(t) {
  var c = t.replace(/x/g, '*').replace(/÷/g, '/');
  if (!c.match(/^[\d\s+\-*/().]+$/)) return null;
  try {
    var r = Function('"use strict";return(' + c + ')')();
    if (isFinite(r)) return 'Hasil dari <b>' + t + '</b> adalah <b>' + r + '</b>.';
  } catch(e) {}
  return null;
}
// ========== JAWABAN ==========
function getJawaban(t) {
  var q = t.toLowerCase().trim();
  var qc = q.replace(/[?!.,]/g, '').trim();
  if (!qc) return 'Silakan ketik pertanyaanmu.';
  var k = konversi(qc);
  if (k) return k;
  var h = hitung(qc);
  if (h) return h;
  var r = cekRumus(qc);
  if (r) return r;
  if (qc.includes('kuis') || qc.includes('quiz')) {
    if (qc.includes('matematika') || qc.includes('mtk')) {
      lastKuis = 'matematika';
      return mulaiKuis('matematika');
    }
    if (qc.includes('ipa') || qc.includes('fisika') || qc.includes('kimia') || qc.includes('biologi')) {
      lastKuis = 'ipa';
      return mulaiKuis('ipa');
    }
    if (qc.includes('ips') || qc.includes('sejarah') || qc.includes('geografi')) {
      lastKuis = 'ips';
      return mulaiKuis('ips');
    }
    if (qc.includes('indonesia')) {
      lastKuis = 'b indonesia';
      return mulaiKuis('b indonesia');
    }
    return 'Mau kuis apa? <b>matematika</b>, <b>ipa</b>, <b>ips</b>, <b>b indonesia</b>';
  }
  if (lastKuis) {
    var d = KUIS[lastKuis];
    if (d) {
      var c = d.find(function(k2) {
        return k2.j.toLowerCase().replace(/\s+/g, '') === qc.replace(/\s+/g, '');
      });
      if (c) {
        confetti();
        var res = '<b>BENAR!</b> Hebat!<br><br>Jawaban <b>' + c.j + '</b> tepat.<br><br>Kuis lagi? Ketik <b>"kuis ' + lastKuis + '"</b>';
        lastKuis = null;
        return res;
      }
    }
  }
  var best = null;
  var score = 0;
  for (var i = 0; i < BRAIN.length; i++) {
    var s = 0;
    var kw = BRAIN[i].keywords;
    for (var j = 0; j < kw.length; j++) {
      if (qc.includes(kw[j])) {
        s += kw[j].length * 2;
        if (qc.startsWith(kw[j])) s += 5;
      }
    }
    if (s > score) {
      score = s;
      best = BRAIN[i];
    }
  }
  if (best && score > 0) return best.jawaban;
  return 'Hmm, aku belum belajar tentang <b>"' + esc(t) + '"</b>.<br><br>Coba tanya:<br>- <b>Matematika</b>: pythagoras, rumus abc<br>- <b>IPA</b>: fotosintesis, newton, sel<br>- <b>IPS</b>: proklamasi, kerajaan, iklim<br>- <b>B. Indonesia</b>: puisi, pantun<br>- <b>B. Inggris</b>: tenses, vocabulary<br>- <b>PKN</b>: pancasila, UUD<br>- <b>Developer</b>: siapa pembuat aplikasi ini<br><br>Atau ketik <b>"kuis matematika"</b>';
}
function beriFeedback(b, t) {
  beep();
  var p = b.parentElement;
  p.querySelectorAll('button').forEach(function(x) { x.classList.remove('active'); });
  b.classList.add('active');
  toast(t === 'up' ? 'Terima kasih!' : 'Maaf, akan belajar lebih baik');
}
function kirim() {
  var inp = document.getElementById('ci');
  var t = inp.value.trim();
  if (!t) return;
  beep(500);
  var u = document.createElement('div');
  u.className = 'msg user';
  u.innerHTML = esc(t) + '<span class="ts">' + getTime() + '</span>';
  chatEl.appendChild(u);
  inp.value = '';
  chatEl.scrollTop = chatEl.scrollHeight;
  var typ = document.createElement('div');
  typ.className = 'msg bot typ';
  typ.id = 'typ';
  typ.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(typ);
  chatEl.scrollTop = chatEl.scrollHeight;
  var delay = 400 + Math.random() * 600;
  setTimeout(function() {
    var t2 = document.getElementById('typ');
    if (t2) t2.remove();
    var b = document.createElement('div');
    b.className = 'msg bot';
    var jw = getJawaban(t);
    b.innerHTML = jw +
      '<div class="fb">' +
      '<button onclick="beriFeedback(this,\'up\')">Membantu</button>' +
      '<button onclick="beriFeedback(this,\'down\')">Tidak</button>' +
      '</div>' +
      '<span class="ts">' + getTime() + '</span>';
    chatEl.appendChild(b);
    chatEl.scrollTop = chatEl.scrollHeight;
    beep(700);
  }, delay);
}
